# Ensure PATH is available to tmux run scripts
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Terminal colors & TrueColor overrides
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",*256col*:Tc"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Eliminate delay when pressing Esc in Vim/Neovim
set -s escape-time 0

# Base index starts from 1 for easier number reaching
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Increase history limit
set -g history-limit 50000

# split panes using | and - (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
# set-option -g allow-rename off

# Vi mode for buffer navigation & copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# # clock mode
# setw -g clock-mode-colour colour1
# #
# # # copy mode
# setw -g mode-style 'fg=colour1 bg=colour18 bold'
# #
# # # pane borders
# set -g pane-border-style 'fg=colour1'
# set -g pane-active-border-style 'fg=colour3'

# set bash as default shell 
if-shell "[ -x /opt/homebrew/bin/bash ]" 'set-option -g default-shell "/opt/homebrew/bin/bash"'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
if-shell "[ -f ~/.tmux/plugins/tmux/catppuccin.tmux ]" 'run ~/.tmux/plugins/tmux/catppuccin.tmux'
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text "%H:%M"
set -g @catppuccin_window_current_text "#{pane_current_path}"

# TPM 插件管理器（必须在最后）
if-shell "[ -f ~/.tmux/plugins/tpm/tpm ]" 'run ~/.tmux/plugins/tpm/tpm'
